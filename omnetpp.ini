[General]
network = ddosvalidation.simulations.DDoSNetwork
sim-time-limit = 120s
warmup-period = 10s
# Ten explicit Mersenne-Twister seeds. Each configuration expands into 10 runs.
seed-0-mt = ${seed=104729,130363,155921,181081,206369,231701,257053,282427,307759,333019}
output-vector-file = results/${configname}-seed${seed}.vec
output-scalar-file = results/${configname}-seed${seed}.sca
**.vector-recording = true
**.scalar-recording = true
# PCAP stores concrete packet bytes, so INET must calculate link-, network-,
# and transport-layer checksums instead of keeping them merely declared.
**.fcsMode = "computed"
**.crcMode = "computed"
*.server.numPcapRecorders = 1
*.server.pcapRecorder[0].pcapFile = "results/${configname}-seed${seed}-server.pcap"
*.server.pcapRecorder[0].fileFormat = "pcap"
*.server.pcapRecorder[0].moduleNamePatterns = "eth[*]"

# Version-pinned INET modules configure IPv4 addresses and routes automatically.
*.configurator.addStaticRoutes = true
*.configurator.addDefaultRoutes = true
*.configurator.addSubnetRoutes = true

# Server applications: UDP echo (port 9000), DNS-amplification sink (53),
# and byte-stream-compatible TCP sink (port 80).
*.server.numApps = 3
*.server.app[0].typename = "UdpSink"
*.server.app[0].localPort = 9000
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 53
*.server.app[2].typename = "TcpSinkApp"
*.server.app[2].localPort = 80

# No attacker application is active in the common baseline.
*.attacker[*].numApps = 0
*.reflector[*].numApps = 0

# Benign bidirectional-looking request traffic. Replies are represented by a
# UDP echo application at the target so that backward packet counts are nonzero.
*.server.app[0].typename = "UdpEchoApp"
*.server.app[0].localPort = 9000
*.benign[*].numApps = 1
*.benign[*].app[0].typename = "UdpBasicApp"
*.benign[*].app[0].destAddresses = "server"
*.benign[*].app[0].destPort = 9000
*.benign[*].app[0].messageLength = 320B
*.benign[*].app[0].sendInterval = uniform(1s, 2s)
*.benign[*].app[0].startTime = uniform(0.2s, 1s)
*.benign[*].app[0].stopTime = 120s

[Config Normal]
description = "50 benign clients; no attack traffic"

[Config UDPFlood]
description = "50 benign clients plus 20 UDP flood sources"
*.attacker[*].numApps = 1
*.attacker[*].app[0].typename = "UdpBasicApp"
*.attacker[*].app[0].destAddresses = "server"
*.attacker[*].app[0].destPort = 9000
*.attacker[*].app[0].messageLength = 1024B
*.attacker[*].app[0].sendInterval = 1ms
*.attacker[*].app[0].startTime = uniform(20s, 21s)
*.attacker[*].app[0].stopTime = 100s

[Config SYNFlood]
description = "TCP connection-exhaustion approximation; parallel sessions held during the attack window"
# Each attacker opens 20 parallel sessions and keeps them until 100 s. A
# one-byte payload is required because INET 4.5.4 TcpSessionApp rejects an
# empty send script with sendBytes=0. This is not raw forged SYN generation.
*.attacker[*].numApps = 20
*.attacker[*].app[*].typename = "TcpSessionApp"
*.attacker[*].app[*].active = true
*.attacker[*].app[*].connectAddress = "server"
*.attacker[*].app[*].connectPort = 80
*.attacker[*].app[*].tOpen = uniform(20s, 21s)
*.attacker[*].app[*].tSend = 0s
*.attacker[*].app[*].sendBytes = 1B
*.attacker[*].app[*].tClose = 100s

[Config DNSAmplification]
description = "Amplified UDP reply traffic emitted by 10 reflectors toward target"
# The reflector response stream represents amplification after spoofed requests.
# It does not claim packet-level equivalence with CICDDoS2019 DNS captures.
*.reflector[*].numApps = 1
*.reflector[*].app[0].typename = "UdpBasicApp"
*.reflector[*].app[0].destAddresses = "server"
*.reflector[*].app[0].localPort = 1025
*.reflector[*].app[0].destPort = 53
*.reflector[*].app[0].messageLength = 4096B
*.reflector[*].app[0].sendInterval = 2ms
*.reflector[*].app[0].startTime = uniform(20s, 21s)
*.reflector[*].app[0].stopTime = 100s
